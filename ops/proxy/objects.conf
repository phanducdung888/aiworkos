# The public face of object storage (ADR-0063).
#
# MinIO stays on the `data` network, where PostgreSQL and Redis are and where nothing that talks to
# the outside is allowed. A client — the connector, a browser — never reaches it directly. This
# proxy sits on the client-facing network, forwards to the store, and is the only thing that spans
# the two.
#
# It is a forwarder and nothing else. It adds no credential, strips none, and makes no access
# decision: a presigned URL already carries its own authority and its own expiry, and a proxy that
# decided anything would be a second authorization system to keep in step with the first.
#
# `$SERVER_NAME` has to match the host WorkOS signs with (`WORKOS_S3_PUBLIC_ENDPOINT_URL`), because
# the signature covers the host. A mismatch is a 403 from the store, not a redirect.

server {
    listen 9000;
    server_name _;

    # Attachments are files, and a proxy that buffers them holds every upload in memory or on disk
    # on its way past. Streaming keeps this process small whatever somebody sends.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    # No health probing here: a presigned URL either verifies or it does not, and the store is the
    # only thing that can say which.
    location / {
        proxy_pass http://minio:9000;

        # The signature covers the Host header. Forwarding the client's Host unchanged is what makes
        # a URL signed for this proxy verify at the store behind it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
