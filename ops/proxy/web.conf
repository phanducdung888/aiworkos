# The web surface and the API, on one origin.
#
# The browser must reach both, and it must reach them at the same origin or the application needs
# CORS on the API and a second base URL in its client. Neither is wanted: `src/api/client.ts` asks
# for `/api/...` relative to the page, and the dev server's `proxy` option does exactly this job
# during development. This is that arrangement, deployed.
#
# So the API is not published for the browser's benefit. `docker-compose.yml` still publishes it on
# loopback because the tests and `ops/dev/*.py` drive it from the host, but a person using WorkOS
# only ever talks to this server.

# The request line without its query string, for the reason set out at length in objects.conf: a
# log is a file, and anything that travels in a URL travels into it. Nothing the API takes in a
# query string is a credential today, and a log format is a poor place to keep that assumption.
log_format web '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
               '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log web;

    root /usr/share/nginx/html;

    # Same origin, same server, different upstream. `/api` is the only prefix the API owns, and the
    # trailing shape here matters: `proxy_pass` without a path appends the request URI unchanged, so
    # `/api/v1/me` arrives at the API as `/api/v1/me` rather than as `/v1/me`.
    location /api/ {
        proxy_pass http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No buffering: the API answers JSON, and a proxy that collects a response before passing it
        # on turns a slow model call into a page that shows nothing and then everything.
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Vite writes a content hash into every asset filename, so one of these files never changes
    # meaning — a new build produces a new name. That is what makes an immutable cache honest here
    # and dishonest for index.html, which keeps its name and points at the new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # A single-page application owns its routes. `/work/0192...` is a real address a person can
    # bookmark, reload and be sent by somebody else, and there is no file behind it — so anything
    # that is not a file is answered with the document that knows how to render it.
    #
    # index.html itself must never be cached: it is the one file whose name stays the same while
    # its contents change, and a stale copy points a browser at assets a new build has deleted.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
