# AI WorkOS — development and pilot stack (ADR-0020).
#
# The network layout is a security control, not plumbing. The `data` network is where PostgreSQL,
# Redis and MinIO live. When the agent runtime arrives in Phase 3 it will be attached to `agent` and
# `egress` only, so that "the AI never touches the database" is enforced by topology rather than by
# discipline (ADR-0002). `tests/architecture/test_ai_db_separation.py` asserts this file keeps that
# shape, including before the agent service exists.

name: ai-workos

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workos}
      POSTGRES_DB: ${POSTGRES_DB:-workos}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/db/dev-roles.sql:/docker-entrypoint-initdb.d/10-dev-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workos}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Published on loopback only: `make migrate`, `make test-db` and `make test` run on the host
    # against 127.0.0.1:5432. The `data` network stays the boundary for container-to-container
    # traffic; this exposes nothing beyond the developer's own machine.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    networks: [data]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-workos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-workos-dev-secret}
    volumes:
      - minio-data:/data
    # Published on loopback only, for the same reason PostgreSQL is: a presigned URL is issued to a
    # client, and a client that cannot reach the store cannot use one. `data` remains the boundary
    # for container-to-container traffic; this exposes nothing beyond the developer's own machine.
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

  # Creates the attachment bucket, once, and exits. Nothing else does: the API signs URLs into a
  # bucket it assumes exists, and every test makes its own — so CP24 was the first time anything
  # uploaded into the bucket a deployment actually uses, and the presigned PUT came back 404.
  #
  # A one-shot rather than something the application does at start-up: creating a bucket is an
  # administrative act, and an application that can create one is an application whose credential
  # can also delete one.
  minio-init:
    # The server image, because `mc` is already in it — the healthcheck above uses it. One image
    # rather than two, and the client is guaranteed to match the server it talks to.
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-workos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-workos-dev-secret}
      WORKOS_S3_BUCKET: ${WORKOS_S3_BUCKET:-workos-attachments}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mc alias set store http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "store/$$WORKOS_S3_BUCKET" &&
        echo "bucket $$WORKOS_S3_BUCKET ready"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [data]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      # Both spellings, because the image is pinned to 25.0 and the rename happened in 26. Only
      # `KEYCLOAK_ADMIN*` is read here; with the 26 names alone — which is what this file carried
      # until CP24 — no administrator is created at all, and the first sign of it is an admin
      # console that rejects every password.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_RELATIVE_PATH: /
      # One issuer, whichever address the token is asked for.
      #
      # `start-dev` otherwise derives `iss` from the request's Host header, so a token fetched from
      # the browser said `http://localhost:8080/...` and one fetched from inside the network said
      # `http://keycloak:8080/...` — and the API compares `iss` to a fixed string, so it accepted
      # one and rejected the other. CP24 measured `KC_HOSTNAME_URL` as having no effect and worked
      # around it by minting every token from the host; CP25 needs the connector to mint its own,
      # and `KC_HOSTNAME` does take effect (the port follows the request, the hostname does not).
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./ops/keycloak:/opt/keycloak/data/import:ro
    # Loopback only, like PostgreSQL and MinIO. The browser signs in against this address, which is
    # also the issuer above; nothing here is reachable off the developer's machine.
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    networks: [app, edge]

  # A real IMAP server for developing and testing the connector (ADR-0061). Never part of a
  # deployment: it is started by `make mail` and the tests that use it are opt-in, for the same
  # reason the real-provider tests are — CI stays offline and nothing is skipped in the environment
  # that should run it.
  #
  # Attached to `edge` only. A connector reaches WorkOS over HTTP like any other client, so a mail
  # server has no business on `data` and this file is where that is visible.
  mail:
    image: greenmail/standalone:2.1.0
    profiles: ["dev"]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
    ports:
      - "127.0.0.1:${GREENMAIL_SMTP_PORT:-3025}:3025"
      - "127.0.0.1:${GREENMAIL_IMAP_PORT:-3143}:3143"
    networks: [edge]

  # The public face of object storage, and the only service that spans `app` and `data`
  # (ADR-0063). MinIO stays where it is; a client reaches its objects through here.
  #
  # It forwards and nothing else: a presigned URL carries its own authority and its own expiry, so
  # this adds no credential and makes no access decision. The one thing it must get right is the
  # Host header, because the signature covers it.
  objects:
    image: nginx:1.27-alpine
    profiles: ["pilot"]
    volumes:
      - ./ops/proxy/objects.conf:/etc/nginx/conf.d/default.conf:ro
    # Published on loopback, because the other client of this proxy is a person's browser and a
    # browser cannot resolve `objects`. The port differs from the one the container listens on and
    # that is fine: the signature covers the Host header the client sends, which carries 9002.
    ports:
      - "127.0.0.1:${OBJECTS_PORT:-9002}:9000"
    depends_on: [minio]
    restart: unless-stopped
    networks: [app, data]

  # The IMAP connector, as it would actually be deployed (ADR-0058, ADR-0061).
  #
  # No build step, because there is nothing to install: the connector is standard library only, so
  # a stock Python image with the source mounted read-only *is* the deployment. That is a statement
  # about the connector rather than a shortcut — it shares no dependency with the application it
  # posts to.
  #
  # `edge` because it talks to the open internet, and `app` because that is where the API it posts
  # to lives. Never `data`: it holds no database credential and has no business on the network
  # where PostgreSQL, Redis and MinIO sit.
  #
  # Both halves are asserted. CP21 checked only that it was absent from `data`, which it satisfied
  # by sharing no network with the API at all — a service that could not have delivered anything.
  imap-connector:
    image: python:3.12-slim
    profiles: ["pilot"]
    working_dir: /srv
    volumes:
      - ./connectors:/srv/connectors:ro
    command: ["python", "-m", "connectors.imap.run", "--interval", "${IMAP_INTERVAL:-60}"]
    environment:
      # No defaults for the credentials, and no `:?` either. Compose interpolates the *whole* file
      # before it looks at profiles, so a required-variable marker here failed every
      # `docker compose` command for anyone who had not set these — including `up postgres`.
      # The connector already refuses to start with a message naming exactly what is missing, which
      # is one check in one place rather than two that can disagree.
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURITY: ${IMAP_SECURITY:-ssl}
      IMAP_USERNAME: ${IMAP_USERNAME}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      WORKOS_URL: ${WORKOS_URL:-http://api:8000}
      WORKOS_ORGANIZATION_ID: ${WORKOS_ORGANIZATION_ID}
      # The connector obtains its own token and renews it (ADR-0066). Keycloak is reached by its
      # service name; the issuer is fixed by `KC_HOSTNAME` above, so the token it mints here is the
      # same issuer the API expects from a browser sign-in.
      WORKOS_OIDC_TOKEN_URL: ${WORKOS_OIDC_TOKEN_URL:-http://keycloak:8080/realms/workos/protocol/openid-connect/token}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-workos-connector}
      WORKOS_CLIENT_SECRET: ${WORKOS_CLIENT_SECRET}
      # Still honoured, and still the thing that stops delivering when it expires.
      WORKOS_INGESTION_TOKEN: ${WORKOS_INGESTION_TOKEN}
    depends_on: [api]
    restart: unless-stopped
    networks: [edge, app]

  api:
    build:
      context: ./backend
    environment:
      # Migrations run as workos_owner, not as the image superuser: FORCE ROW LEVEL SECURITY
      # does not apply to a superuser, so owning the schema with one would quietly disable the
      # second of the two isolation mechanisms ADR-0008 relies on.
      WORKOS_DATABASE_URL: postgresql+psycopg://workos_owner:${OWNER_DB_PASSWORD:-workos_owner}@postgres:5432/${POSTGRES_DB:-workos}
      WORKOS_APP_DATABASE_URL: postgresql+psycopg://workos_app:${APP_DB_PASSWORD:-workos_app}@postgres:5432/${POSTGRES_DB:-workos}
      # Where this process reaches the store, and where it tells a client to. The second must be a
      # name the client can resolve *and* the one the URL is signed for — the signature covers the
      # host, so these cannot be reconciled after the fact (ADR-0063). `objects` is the proxy above.
      WORKOS_S3_ENDPOINT_URL: ${WORKOS_S3_ENDPOINT_URL:-http://minio:9000}
      # A browser opening an attachment, and a connector uploading one, are on different networks
      # and cannot use each other's URLs (ADR-0067). Both go through the `objects` proxy; they just
      # reach it by different names, and the signature covers the name.
      WORKOS_S3_PUBLIC_ENDPOINT_URL: ${WORKOS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9002}
      WORKOS_S3_UPLOAD_ENDPOINT_URL: ${WORKOS_S3_UPLOAD_ENDPOINT_URL:-http://objects:9000}
      WORKOS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-workos}
      WORKOS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-workos-dev-secret}
      # The issuer is a string this process compares; the JWKS address is one it fetches. They are
      # different values on purpose — see the Keycloak service above.
      WORKOS_OIDC_ISSUER: ${KEYCLOAK_ISSUER_BASE:-http://localhost:8080}/realms/workos
      # ...which is not an address this process can resolve, and does not need to be.
      WORKOS_OIDC_JWKS_URL: http://keycloak:8080/realms/workos/protocol/openid-connect/certs
      # `fake` unless an environment says otherwise, so the real adapter is never on a default
      # path (ADR-0049). No default for the key: it is passed through or it is absent.
      WORKOS_LLM_PROVIDER: ${WORKOS_LLM_PROVIDER:-fake}
      WORKOS_OPENAI_API_KEY: ${OPENAI_API_KEY}
      WORKOS_OPENAI_MODEL: ${WORKOS_OPENAI_MODEL:-gpt-4o}
    # Loopback only. The pilot drives the API from the host the way the frontend does.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app, data, agent]

  # The job worker (ADR-0044, ADR-0046). Same image as the API, different command: an approved
  # action must be executed by the same code the API validated it against.
  #
  # `data` only. It claims rows and runs handlers; nothing calls it and it calls nothing over HTTP,
  # so it has no reason to be on `app` — and being on one network rather than two is the difference
  # between a service that straddles the boundary and one that sits behind it.
  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.runner"]
    environment:
      WORKOS_DATABASE_URL: postgresql+psycopg://workos_owner:${OWNER_DB_PASSWORD:-workos_owner}@postgres:5432/${POSTGRES_DB:-workos}
      WORKOS_APP_DATABASE_URL: postgresql+psycopg://workos_app:${APP_DB_PASSWORD:-workos_app}@postgres:5432/${POSTGRES_DB:-workos}
      WORKOS_WORKER_DATABASE_URL: postgresql+psycopg://workos_worker:${WORKER_DB_PASSWORD:-workos_worker}@postgres:5432/${POSTGRES_DB:-workos}
      WORKOS_S3_ENDPOINT_URL: ${WORKOS_S3_ENDPOINT_URL:-http://minio:9000}
      WORKOS_S3_PUBLIC_ENDPOINT_URL: ${WORKOS_S3_PUBLIC_ENDPOINT_URL:-http://objects:9000}
      WORKOS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-workos}
      WORKOS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-workos-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [data]

volumes:
  postgres-data:
  minio-data:

networks:
  # Public-facing. Reverse proxy and anything a browser must reach.
  edge:
  # Application traffic.
  app:
  # The data tier. The agent runtime must never appear here.
  data:
  # Agent runtime to the internal Tool Gateway port only. Phase 3.
  agent:
  # Outbound model-provider access from the agent runtime only. Phase 3.
  egress:
