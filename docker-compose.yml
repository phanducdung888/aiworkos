# AI WorkOS — development and pilot stack (ADR-0020).
#
# The network layout is a security control, not plumbing. The `data` network is where PostgreSQL,
# Redis and MinIO live. When the agent runtime arrives in Phase 3 it will be attached to `agent` and
# `egress` only, so that "the AI never touches the database" is enforced by topology rather than by
# discipline (ADR-0002). `tests/architecture/test_ai_db_separation.py` asserts this file keeps that
# shape, including before the agent service exists.

name: ai-workos

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workos}
      POSTGRES_DB: ${POSTGRES_DB:-workos}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/db/dev-roles.sql:/docker-entrypoint-initdb.d/10-dev-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workos}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Published on loopback only: `make migrate`, `make test-db` and `make test` run on the host
    # against 127.0.0.1:5432. The `data` network stays the boundary for container-to-container
    # traffic; this exposes nothing beyond the developer's own machine.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    networks: [data]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-workos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-workos-dev-secret}
    volumes:
      - minio-data:/data
    # Published on loopback only, for the same reason PostgreSQL is: a presigned URL is issued to a
    # client, and a client that cannot reach the store cannot use one. `data` remains the boundary
    # for container-to-container traffic; this exposes nothing beyond the developer's own machine.
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_RELATIVE_PATH: /
    volumes:
      - ./ops/keycloak:/opt/keycloak/data/import:ro
    networks: [app, edge]

  # A real IMAP server for developing and testing the connector (ADR-0061). Never part of a
  # deployment: it is started by `make mail` and the tests that use it are opt-in, for the same
  # reason the real-provider tests are — CI stays offline and nothing is skipped in the environment
  # that should run it.
  #
  # Attached to `edge` only. A connector reaches WorkOS over HTTP like any other client, so a mail
  # server has no business on `data` and this file is where that is visible.
  mail:
    image: greenmail/standalone:2.1.0
    profiles: ["dev"]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
    ports:
      - "127.0.0.1:${GREENMAIL_SMTP_PORT:-3025}:3025"
      - "127.0.0.1:${GREENMAIL_IMAP_PORT:-3143}:3143"
    networks: [edge]

  # The public face of object storage, and the only service that spans `app` and `data`
  # (ADR-0063). MinIO stays where it is; a client reaches its objects through here.
  #
  # It forwards and nothing else: a presigned URL carries its own authority and its own expiry, so
  # this adds no credential and makes no access decision. The one thing it must get right is the
  # Host header, because the signature covers it.
  objects:
    image: nginx:1.27-alpine
    profiles: ["pilot"]
    volumes:
      - ./ops/proxy/objects.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [minio]
    restart: unless-stopped
    networks: [app, data]

  # The IMAP connector, as it would actually be deployed (ADR-0058, ADR-0061).
  #
  # No build step, because there is nothing to install: the connector is standard library only, so
  # a stock Python image with the source mounted read-only *is* the deployment. That is a statement
  # about the connector rather than a shortcut — it shares no dependency with the application it
  # posts to.
  #
  # `edge` because it talks to the open internet, and `app` because that is where the API it posts
  # to lives. Never `data`: it holds no database credential and has no business on the network
  # where PostgreSQL, Redis and MinIO sit.
  #
  # Both halves are asserted. CP21 checked only that it was absent from `data`, which it satisfied
  # by sharing no network with the API at all — a service that could not have delivered anything.
  imap-connector:
    image: python:3.12-slim
    profiles: ["pilot"]
    working_dir: /srv
    volumes:
      - ./connectors:/srv/connectors:ro
    command: ["python", "-m", "connectors.imap.run", "--interval", "${IMAP_INTERVAL:-60}"]
    environment:
      # No defaults for the credentials, and no `:?` either. Compose interpolates the *whole* file
      # before it looks at profiles, so a required-variable marker here failed every
      # `docker compose` command for anyone who had not set these — including `up postgres`.
      # The connector already refuses to start with a message naming exactly what is missing, which
      # is one check in one place rather than two that can disagree.
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURITY: ${IMAP_SECURITY:-ssl}
      IMAP_USERNAME: ${IMAP_USERNAME}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      WORKOS_URL: ${WORKOS_URL:-http://api:8000}
      WORKOS_INGESTION_TOKEN: ${WORKOS_INGESTION_TOKEN}
      WORKOS_ORGANIZATION_ID: ${WORKOS_ORGANIZATION_ID}
    depends_on: [api]
    restart: unless-stopped
    networks: [edge, app]

  api:
    build:
      context: ./backend
    environment:
      # Migrations run as workos_owner, not as the image superuser: FORCE ROW LEVEL SECURITY
      # does not apply to a superuser, so owning the schema with one would quietly disable the
      # second of the two isolation mechanisms ADR-0008 relies on.
      WORKOS_DATABASE_URL: postgresql+psycopg://workos_owner:${OWNER_DB_PASSWORD:-workos_owner}@postgres:5432/${POSTGRES_DB:-workos}
      WORKOS_APP_DATABASE_URL: postgresql+psycopg://workos_app:${APP_DB_PASSWORD:-workos_app}@postgres:5432/${POSTGRES_DB:-workos}
      # Where this process reaches the store, and where it tells a client to. The second must be a
      # name the client can resolve *and* the one the URL is signed for — the signature covers the
      # host, so these cannot be reconciled after the fact (ADR-0063). `objects` is the proxy above.
      WORKOS_S3_ENDPOINT_URL: ${WORKOS_S3_ENDPOINT_URL:-http://minio:9000}
      WORKOS_S3_PUBLIC_ENDPOINT_URL: ${WORKOS_S3_PUBLIC_ENDPOINT_URL:-http://objects:9000}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app, data, agent]

volumes:
  postgres-data:
  minio-data:

networks:
  # Public-facing. Reverse proxy and anything a browser must reach.
  edge:
  # Application traffic.
  app:
  # The data tier. The agent runtime must never appear here.
  data:
  # Agent runtime to the internal Tool Gateway port only. Phase 3.
  agent:
  # Outbound model-provider access from the agent runtime only. Phase 3.
  egress:
