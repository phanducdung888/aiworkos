[project]
name = "ai-workos-backend"
version = "0.1.0"
description = "AI WorkOS backend — Work Core and platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # Access tokens are validated in-process against Keycloak's JWKS: issuer, audience, expiry and
    # signature, on every request (security-model §2). No introspection endpoint, no token cache.
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.32",
    "schemathesis>=3.36",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live PostgreSQL",
    "architecture: asserts an architectural invariant",
    "schemathesis: property-based checks over the generated OpenAPI document",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/contexts", "app/platform"]
plugins = []

# Without this, setuptools auto-discovery refuses to build: the backend has three top-level
# directories (`app`, `migrations`, `tests`) and a flat layout with more than one candidate is
# ambiguous, so `pip install -e ".[dev]"` — i.e. `make install`, i.e. the first command in the
# README — fails outright. `app` is the package; migrations are run by Alembic from the working
# directory and are deliberately not importable as part of it.
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]
